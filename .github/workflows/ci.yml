name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.16.10
      - name: Lint
        run: ruff check .
      - name: Format check (tests only; research code is left as recorded)
        run: ruff format --check tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Keep the Ollama-backed embedding strategies off so lexical results are compared.
      OLLAMA_BASE_URL: http://127.0.0.1:9
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository test suite (includes recorded-result reproduction)
        run: python -m unittest discover -s tests -v
      - name: CLAIM-24 Mandate Cell 7 unit tests
        working-directory: claim_24
        run: python -m unittest test_mandate_cell7 -v
      - name: Committed results were not modified by the run
        run: git diff --exit-code
